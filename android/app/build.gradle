plugins {
    id 'com.android.application'
}

android {
    namespace 'se.felixarvid.ashfall'
    compileSdk 35

    defaultConfig {
        applicationId 'se.felixarvid.ashfall'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.3.0'
    }

    // keep the media and binary assets uncompressed so the WebView can be served ranges straight from the APK
    androidResources {
        noCompress 'glb', 'ktx2', 'ogg', 'mp3', 'wav', 'wasm', 'webp', 'png', 'jpg'
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
