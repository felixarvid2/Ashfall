name: CI

# Typecheck, unit tests, the production build, the asset checks and a quick perf budget on every pull request.
# No browser: the e2e scenarios stay a local check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Asset checks (orphans, missing ids, texture size caps)
        run: npm run assets:check
      - name: Quick perf budget
        run: npm run perf:quick
