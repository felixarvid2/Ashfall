name: Release

# Build the game and publish a GitHub release with the playable web build as a zip. Three ways in:
#  - merge a release-notes file docs/releases/vX.Y.Z.md to main (creates or updates release vX.Y.Z;
#    the only way that needs no tag push or Actions UI, e.g. from a Claude Code cloud session),
#  - push a tag like v1.0.0,
#  - run it by hand (workflow_dispatch) with a tag name.
# Assets: the web zip, the Thor APK and the Ubuntu/Debian .deb (docs/linux.md).
# The release body is docs/releases/<tag>.md when that file exists.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['docs/releases/v*.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # A push to main that changed docs/releases/v*.md: release the newest changed notes file.
            FILE=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'docs/releases/v*.md' | sort -V | tail -1)
            TAG=$(basename "$FILE" .md)
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Bad tag: '$TAG'"; exit 1; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
      - name: Zip the web build
        run: |
          cp docs/credits.md dist/CREDITS.md
          cat > dist/HOW-TO-PLAY.txt <<'TXT'
          Ashfall - web build

          The game is a web page, but browsers block it when opened straight from disk (file://),
          so serve this folder with any static web server and open the address it prints:

            npx serve .                  (Node.js)
            python3 -m http.server 8000  (Python, then open http://localhost:8000)

          Controls: left mouse moves and attacks, right mouse and 1-4 are skills, Space dodges,
          Q drinks a stim pack, I/K/M/J open inventory, skills, map and quests. On a phone the
          game shows touch controls.
          TXT
          (cd dist && zip -qr "../ashfall-${TAG}-web.zip" . -x '*.map')
      - name: Check the zip has no source maps
        run: |
          if unzip -Z1 "ashfall-${TAG}-web.zip" | grep -E '\.map$'; then
            echo "The release zip contains .map files (listed above)."
            exit 1
          fi
          echo "No .map files in the zip."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the AYN Thor APK
        run: |
          npm run build:android
          cp dist-android/ashfall-thor.apk "ashfall-${TAG}-thor.apk"
      - name: Build the Ubuntu/Debian package
        run: |
          npm run build:deb -- --version "${TAG#v}"
          cp "dist-linux/ashfall_${TAG#v}_amd64.deb" "ashfall-${TAG}-ubuntu-amd64.deb"
      - name: Release notes
        run: |
          {
            echo "Playable web build of Ashfall. Unzip \`ashfall-${TAG}-web.zip\` and serve the folder"
            echo "with any static web server (see HOW-TO-PLAY.txt inside), e.g. \`npx serve .\`."
            echo "For the AYN Thor: install \`ashfall-${TAG}-thor.apk\` (allow installs from unknown sources)."
            echo "On Ubuntu/Debian: install \`ashfall-${TAG}-ubuntu-amd64.deb\` with \`sudo apt install ./ashfall-${TAG}-ubuntu-amd64.deb\`."
            if [ -f "docs/releases/${TAG}.md" ]; then echo; cat "docs/releases/${TAG}.md"; fi
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Ashfall ${{ env.TAG }}
          files: |
            ashfall-${{ env.TAG }}-web.zip
            ashfall-${{ env.TAG }}-thor.apk
            ashfall-${{ env.TAG }}-ubuntu-amd64.deb
          body_path: release-notes.md
          overwrite_files: true
